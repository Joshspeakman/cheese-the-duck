appId: com.joshspeakman.cheese-the-duck.ascii-engine
productName: Cheese the Duck ASCII Engine
directories:
  output: dist
asar: true
files:
  - main.cjs
  - local-speech.cjs
  - pond-command.cjs
  - preload.cjs
  - client/**
  - package.json
  - licenses/**
extraResources:
  - from: build/simulation/cheese-simulation
    to: simulation
  - from: build/local-ai/runtime/llama-b12255
    to: local-ai
    filter:
      - llama-server
      - "*.dylib"
      - "*.metal"
      - "LICENSE*"
mac:
  target:
    - target: dir
      arch: [arm64]
  category: public.app-category.games
  icon: build/icon.png
  identity: '-'
  hardenedRuntime: false
npmRebuild: false
