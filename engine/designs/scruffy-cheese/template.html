<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cheese — Scruffy family</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08181c;color:#f3e6c9;font-family:system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:32px 24px 70px}h1{font-size:34px;margin:0 0 10px}h2{font-size:24px;margin:30px 0 12px}p{color:#a8c0b6;line-height:1.5}header p{margin:0 0 22px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}button,select{font:inherit;color:inherit;border:1px solid #38514e;background:#132a2e;border-radius:6px;padding:10px 13px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#315149;border-color:#e5ba70}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e5ba70;outline-offset:3px}select option{background:#14282b}.label{font-size:13px;color:#a8c0b6}#timeline{flex:1;min-width:180px;accent-color:#e5ba70}#counter{min-width:135px;font:14px Menlo,monospace;color:#a8c0b6}.stage{background:#0c1c21;border:1px solid #38514e;border-radius:10px;overflow:hidden}.stage canvas{width:100%;display:block}.stage-top{padding:16px 20px 8px}#selection{font-size:22px;font-weight:700}#detail{margin:6px 0;font-size:14px}#world{aspect-ratio:1200/560}.variants{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.ages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{padding:0;text-align:left;overflow:hidden;background:#0c1c21}.card canvas{width:100%;display:block}.tools{border:1px solid #38514e;border-radius:8px;padding:0 14px;margin-bottom:18px}.stage-age{color:#edbd70}#age-note{font-size:15px;margin:12px 0 4px}@media(max-width:850px){.variants{grid-template-columns:repeat(2,minmax(0,1fr))}.ages{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:22px 12px}.variants,.ages{grid-template-columns:1fr}h1{font-size:27px}}
</style></head><body><main>
<header><h1>The scruffy little menace, growing up</h1><p>Six related designs. Nine ages. Ten animated actions. Start with A, the closest to your pick.</p></header>
<div class="tools"><div class="controls">
<label>Age <select id="age"></select></label><label>Action <select id="action"></select></label>
<button id="play" aria-pressed="true">Pause</button><button id="step">Next pose</button><button id="facing" aria-pressed="false">Face left</button>
<label>Speed <select id="speed"><option value="0.5">Half</option><option value="1" selected>Normal</option><option value="1.5">Fast</option></select></label>
</div><div class="controls"><label for="timeline" class="label">Scrub loop</label><input id="timeline" type="range" min="0" max="999" value="0"><span id="counter"></span></div></div>
<section class="stage"><div class="stage-top"><div id="selection"></div><p id="detail"></p></div><canvas id="world" width="1200" height="560"></canvas></section>
<h2>Choose a scruffy design</h2><p>Each card shows the selected age and action. Click a design to see its complete age lineup below.</p><div class="variants" id="variants"></div>
<h2 id="age-heading">All nine ages</h2><p id="age-note"></p><div class="ages" id="ages"></div>
</main><!-- GALLERY_SCRIPT --></body></html>
