<!doctype html><meta charset="utf-8"><title>Cheese · Wonder workshop</title>
<style>body{background:#142b23;color:#ecdbb3;font:20px Georgia;margin:24px}canvas{display:block;max-width:100%;margin:24px 0}</style>
<h1>Wonder workshop · current in-game art</h1>
<script type="module">
import {WONDER_BLUEPRINTS} from '../client/wonder-workshop.mjs';
import {WONDER_ROUTINES,wonderGeometry,drawWonderTools,wonderPose} from '../client/wonder-routines.mjs';
import {itemSprite,ItemPainter} from '../client/ultra-items.mjs';
import {characterSprite,drawCharacter} from '../client/ultra-characters.mjs';
import {SceneCanvas} from '../client/ultra-renderer.mjs';
const painter=new ItemPainter();
// Representative saved states: at rest, and a lively state for each object.
export const ACTIVE={topiary_duck:{growth:.8,blossom:1,snow:0},zen_garden:{pattern:1,raked:1,leaves:.4},ice_sculpture:{melt:.35,puddle:.6,frost:.5,shine:1},
 sand_castle:{towers:4,moat:.8,flag:1},gong:{ring:1,shine:1},aurora:{power:1,glow:1,ribbons:4,hue:.5},rainbow_generator:{arc:1,mist:1,water:.7},
 weather_machine:{setting:2,cloud:1,charge:.8,bolt:1},portal:{energy:1,rune:4,stability:.4},wormhole:{aperture:1,spin:.3},black_hole:{mass:.8,containment:.25,hum:1},
 volcano:{eruption:1,pressure:.2,ash:.6,warmth:1},tornado:{size:.9,spin:1,debris:.6,mood:1},antigravity:{field:1,floaters:6},force_field:{shield:1,charge:.5,ripple:1},
 cosmic_arch:{starlight:1,traced:5,moss:.5},time_machine:{flux:1,door:1,year:1885},tardis:{door:1,lamp:1,whoosh:1},dimensional_door:{door:1,dimension:4,draft:1},
 teleporter:{beam:1,charge:1},robot_butler:{wave:1,battery:1,shine:1},cloning_machine:{sample:1,hologram:1,bubbles:1},transmogrifier:{output:2,smoke:1},
 money_printer:{stack:.8,jam:.6},perpetual_motion:{speed:1,squeak:1,turns:4096},DNA_mixer:{spin:1,printout:1,vial_a:2,vial_b:3},shrink_ray:{glow:1,target:.3},
 growth_ray:{glow:1,target:2.6},genie_lamp:{smoke:1,polish:1},invisible_cloak:{shimmer:1},dream_catcher:{dreams:1,tangle:.5,feathers:6},dragon_egg:{incubation:1,wobble:1,warmth:1,embers:1}};
window.reviewWonders=()=>{
 const images={},ids=Object.keys(WONDER_BLUEPRINTS);let drawn=0;
 for(const mode of ['rest','active'])for(let page=0;page<Math.ceil(ids.length/6);page++){
  const canvas=document.createElement('canvas');canvas.width=1800;canvas.height=1600;const c=canvas.getContext('2d');c.fillStyle='#142b23';c.fillRect(0,0,1800,1600);
  ids.slice(page*6,page*6+6).forEach((id,n)=>{
   const m=itemSprite(id,2.3,{state:{wonder:mode==='active'?ACTIVE[id]:{}}}),x=n%3*600,y=Math.floor(n/3)*800;
   if(m.construction!=='wonder-v1')throw Error(id+' did not route to the wonder workshop');
   c.fillStyle='#e5d8b4';c.font='23px Menlo';c.fillText(id+' · '+mode,x+20,y+32);
   const unit=Math.min(5,550/m.width,690/(m.art.length*1.5));painter.draw(c,m,x+300,y+770,unit/m.detailScale,{surface:'#142b23',outline:'#0a1712'});drawn++;
  });images['wonders-'+mode+'-'+page]=canvas.toDataURL('image/png');document.body.append(canvas);
 }
 // Cheese at three ages mid-routine on three different wonders.
 const canvas=document.createElement('canvas');canvas.width=1800;canvas.height=1150;const ctx=canvas.getContext('2d');ctx.fillStyle='#142b23';ctx.fillRect(0,0,1800,1150);
 [['hatchling','ice_tongue_test'],['adult','gong_mighty_bong'],['elder','zen_rake_rings']].forEach(([stage,key],i)=>{
  const spec=WONDER_ROUTINES[key],routine={id:key,elapsed:spec.duration*.36},pose=wonderPose(routine);
  const home={...itemSprite(spec.item,0,{state:{wonder:ACTIVE[spec.item]},pose:{wonder:pose}}),item:true,x:50+i*100,y:125,scale:WONDER_BLUEPRINTS[spec.item].scale};
  const character={...characterSprite({stage,state:'idle',facing:true,performance:{kind:'wonder',routine}},2),x:home.x,y:home.y};
  painter.draw(ctx,home,home.x*6,home.y*8,6*home.scale,{surface:'#142b23'});
  const staged=wonderGeometry(home,{character,inside:1},6,8);drawCharacter(ctx,staged.character,6,8,'#142b23');drawWonderTools(ctx,staged);
  ctx.fillStyle='#e5d8b4';ctx.font='24px Menlo';ctx.fillText(stage+' · '+key,i*600+20,35);
 });images['wonders-working']=canvas.toDataURL('image/png');document.body.append(canvas);
 return {images,drawn};
};
window.replayWonders=frames=>{
 const view=new SceneCanvas();view.resize(1500,950);const images={},costs=[];let drawn=0,workers=0;
 for(const [i,s]of frames.entries()){
  const before=JSON.stringify(s),start=performance.now();view.draw(s,i*.2,.2);costs.push(performance.now()-start);
  if(JSON.stringify(s)!==before)throw Error('Wonder renderer changed native state');
  let here=0;for(const o of view.world.objects)if(o.construction==='wonder-v1'){drawn++;here++;if(o.clipped)throw Error('Clipped wonder '+o.id);workers+=o.wonderWorkers?.length||0;}
  if(!here)throw Error('Native frame '+s.review+' drew no wonder');
  if(s.review)images['wonder-live-'+s.review]=view.canvas.toDataURL('image/png');
 }
 if(workers!==frames.length)throw Error('Expected Cheese staged at the wonder in every frame, got '+workers+'/'+frames.length);
 costs.sort((a,b)=>a-b);return {frames:frames.length,drawn,workers,medianMs:costs[Math.floor(costs.length*.5)],p95Ms:costs[Math.floor(costs.length*.95)],images};
};
window.measureWonders=scene=>{
 // Steady-state cost: the same scene drawn 200 times as time advances, with the
 // eight placed wonders and with them removed (everything else identical).
 const run=s=>{const view=new SceneCanvas();view.resize(1500,950);const costs=[];for(let i=0;i<220;i++){const t0=performance.now();view.draw(s,i/30,1/30);if(i>=20)costs.push(performance.now()-t0);}costs.sort((a,b)=>a-b);return {median:costs[100],p95:costs[190],max:costs.at(-1)};};
 const without=structuredClone(scene),ids=new Set(Object.keys(WONDER_BLUEPRINTS));
 for(const k of ['items'])if(Array.isArray(without[k]))without[k]=without[k].filter(o=>!ids.has(o.id));
 if(without.living?.layout)for(const k of ['placed','copies'])if(Array.isArray(without.living.layout[k]))without.living.layout[k]=without.living.layout[k].filter(o=>!ids.has(o.id||o.item));
 const view=new SceneCanvas();view.resize(1500,950);view.draw(scene,0,0);const image=view.canvas.toDataURL('image/png');
 return {withWonders:run(scene),withoutWonders:run(without),placed:(scene.items||[]).filter(o=>ids.has(o.id)).length,image};
};
window.rasterCost=()=>{
 const out={};
 for(const id of Object.keys(WONDER_BLUEPRINTS)){
  const m=itemSprite(id,1.3,{state:{wonder:ACTIVE[id]}}),p=new ItemPainter(),t0=performance.now();
  for(let i=0;i<5;i++){p.cache.clear();p.bytes=0;p.image(m,6,'#142b23','#0a1712',1.5);}
  out[id]={ms:+((performance.now()-t0)/5).toFixed(2),fills:m.fills.length,glyphs:m.art.join('').replace(/ /g,'').length};
 }
 return out;
};
window.replayWonderCompany=frames=>{
 const view=new SceneCanvas();view.resize(1500,950);const images={};let visitors=0;
 for(const [i,s]of frames.entries()){
  const before=JSON.stringify(s);view.draw(s,i*.2,.2);
  if(JSON.stringify(s)!==before)throw Error('Wonder company renderer changed native state');
  const home=view.world.objects.find(o=>o.construction==='wonder-v1');if(!home)throw Error('no wonder drawn');
  const guests=(home.wonderWorkers||[]).filter(w=>!w.character.cheese);if(!guests.length)throw Error('visitor not staged at the wonder in frame '+i);visitors+=guests.length;
  images['wonder-company-'+i]=view.canvas.toDataURL('image/png');
 }
 return {frames:frames.length,visitors,images};
};
</script>
