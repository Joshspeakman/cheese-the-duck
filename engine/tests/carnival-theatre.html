<!doctype html><meta charset="utf-8"><title>Cheese · Shared carnival rides</title>
<style>body{background:#142b23;color:#eadcb9;font:20px Georgia;margin:24px}canvas{max-width:100%}</style>
<h1>Shared carnival rides</h1><div id="view"></div>
<script type="module">
import {SceneCanvas} from '../client/ultra-renderer.mjs';
import {carnivalGeometry} from '../client/carnival-routines.mjs';
window.replayCarnival=frames=>{
 const view=new SceneCanvas();view.resize(1500,950);document.querySelector('#view').append(view.canvas);
 const images={},costs=[];let bodies=0,hits=0,contacts=0;
 for(const [i,s]of frames.entries()){
  const before=JSON.stringify(s),start=performance.now();view.draw(s,i*.2,.2);costs.push(performance.now()-start);
  if(before!==JSON.stringify(s))throw Error('Renderer changed native snapshot');
  const plan=s.living.plan,w=plan?.carnival_work;
  if(!w)continue;
  const home=view.world.objects.find(o=>o.instance===plan.instance);
  if(!home)throw Error('Missing real ride');
  for(const rider of home.carnivalRiders||[]){
   const staged=carnivalGeometry(home,rider,view.sx,view.sy);bodies++;
   if(staged.inside===1)contacts++;
   if(staged.character.visitor||staged.character.story){
    const hit=view.hits.find(h=>h.id===staged.character.id);
    if(!hit)throw Error('Missing hit '+staged.character.id);
    if(view.hit((hit.x+hit.w/2)/view.canvas.width,(hit.y+hit.h/2)/view.canvas.height)?.id!==staged.character.id)throw Error('Guest not selectable at cabin '+staged.character.id);
    hits++;
   }
  }
  const key=(w.id.startsWith('wheel')?'wheel':'carousel')+'-'+w.stage;
  if(['board_a','index_b','board_b','ride','weather_return','unload_b','return_a','unload_a'].includes(w.stage)&&!images[key]&&(!['board_a','board_b','unload_a','unload_b'].includes(w.stage)||w.clock>2))images[key]=view.canvas.toDataURL();
  if(w.stage==='ride'&&w.clock>10&&!images[w.id])images[w.id]=view.canvas.toDataURL();
 }
 costs.sort((a,b)=>a-b);
 return {images,frames:frames.length,bodies,hits,contacts,p95Ms:costs[Math.floor(costs.length*.95)],medianMs:costs[Math.floor(costs.length*.5)]};
};
</script>
