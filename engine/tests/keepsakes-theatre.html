<!doctype html><meta charset="utf-8"><title>Cheese · Keepsake workshop</title>
<style>body{background:#142b23;color:#ecdbb3;font:20px Georgia;margin:24px}canvas{display:block;max-width:100%;margin:24px 0}</style>
<h1>Keepsake workshop · current in-game art</h1>
<script type="module">
import {KEEPSAKE_BLUEPRINTS} from '../client/keepsake-workshop.mjs';
import {itemSprite,ItemPainter} from '../client/ultra-items.mjs';
import {SceneCanvas} from '../client/ultra-renderer.mjs';
import {characterSprite,drawCharacter} from '../client/ultra-characters.mjs';
import {keepsakeGeometry,drawKeepsakeTools,keepsakePose} from '../client/keepsake-routines.mjs';
const painter=new ItemPainter();
window.reviewKeepsakes=()=>{
 const images={},ids=Object.keys(KEEPSAKE_BLUEPRINTS);
 for(let page=0;page<4;page++){
  const canvas=document.createElement('canvas');canvas.width=1800;canvas.height=1600;const c=canvas.getContext('2d');c.fillStyle='#142b23';c.fillRect(0,0,1800,1600);
  ids.slice((page%2)*6,(page%2)*6+6).forEach((id,n)=>{
   const open=page>1?1:0,m=itemSprite(id,2.3,{state:{keepsake:{open,litres:38,page:4}},pose:{keepsake:{open,sort:open,turn:open*.45,fold:1-open}}}),x=n%3*600,y=Math.floor(n/3)*800;
   c.fillStyle='#e5d8b4';c.font='23px Menlo';c.fillText(id+(open?' · open':' · put away'),x+20,y+32);
   const unit=Math.min(5,550/m.width,690/(m.art.length*1.5));painter.draw(c,m,x+300,y+755,unit/m.detailScale,{surface:'#142b23',outline:'#0a1712'});
  });images['keepsakes-'+page]=canvas.toDataURL('image/png');document.body.append(canvas);
 }
 const canvas=document.createElement('canvas');canvas.width=1800;canvas.height=1150;const ctx=canvas.getContext('2d');ctx.fillStyle='#142b23';ctx.fillRect(0,0,1800,1150);
 ['hatchling','adult','elder'].forEach((stage,i)=>{
  const routine={id:'book_leaf',elapsed:21,start_open:0},pose=keepsakePose(routine);
  const home={...itemSprite('ancient_tome',0,{state:{keepsake:{page:4}},pose:{keepsake:pose}}),item:true,x:55+i*100,y:125,scale:KEEPSAKE_BLUEPRINTS.ancient_tome.scale};
  const character={...characterSprite({stage,state:'idle',facing:true,performance:{kind:'keepsake',routine}},2),x:home.x,y:home.y};
  painter.draw(ctx,home,home.x*6,home.y*8,6*home.scale,{surface:'#142b23'});
  const staged=keepsakeGeometry(home,{character,inside:1},6,8);drawCharacter(ctx,staged.character,6,8,'#142b23');drawKeepsakeTools(ctx,staged);
  ctx.fillStyle='#e5d8b4';ctx.font='24px Menlo';ctx.fillText(stage,i*600+20,35);
 });images['keepsake-reading']=canvas.toDataURL('image/png');document.body.append(canvas);
 return images;
};
window.replayKeepsakes=frames=>{
 const view=new SceneCanvas();view.resize(1500,950);const images={},costs=[];let drawn=0,workers=0;
 for(const [i,s]of frames.entries()){
  const before=JSON.stringify(s),start=performance.now();view.draw(s,i*.2,.2);costs.push(performance.now()-start);
  if(JSON.stringify(s)!==before)throw Error('Keepsake renderer changed native state');
  for(const o of view.world.objects)if(o.construction==='keepsake-v1'){drawn++;if(o.clipped)throw Error('Clipped keepsake '+o.id);workers+=o.keepers?.length||0;}
  if(s.review)images['keepsake-live-'+s.review]=view.canvas.toDataURL('image/png');
 }
 costs.sort((a,b)=>a-b);return {frames:frames.length,drawn,workers,medianMs:costs[Math.floor(costs.length*.5)],p95Ms:costs[Math.floor(costs.length*.95)],images};
};
</script>
