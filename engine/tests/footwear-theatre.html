<!doctype html><meta charset="utf-8"><title>Cheese · The cobbler’s bench</title>
<style>body{margin:28px;background:#132b28;color:#e7dbb8;font:17px/1.5 system-ui}header{position:sticky;top:0;background:#132b28ee;padding:10px;z-index:2}h1{margin:0}select,button{background:#29453c;color:inherit;padding:9px;border:1px solid #698376;border-radius:7px;font:inherit}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px}article{background:#183631;border:1px solid #3d5a4a;border-radius:12px;padding:12px}h2{margin:5px 0;font-size:19px}canvas{width:100%}p{margin:4px 0;color:#b5c6b5}</style>
<header><h1>The cobbler’s bench</h1><p>Boots, slippers, skates and sandals, fitted to each actual foot. Preview only; nothing is equipped or granted.</p><select id="age" aria-label="Age"></select> <select id="pose" aria-label="Action"></select> <select id="weather" aria-label="Material preview"><option value="dry">Dry</option><option value="rain">Rain soaked</option><option value="snow">Caught snow</option><option value="rumpled">Loose fit</option><option value="mud">Muddy shoes</option></select> <button id="motion">Pause preview</button></header><main id="cards"></main>
<script type="module">
import {FOOTWEAR_BLUEPRINTS} from '../client/footwear-workshop.mjs';import {itemSprite,ItemPainter} from '../client/ultra-items.mjs';import {characterSprite,drawCharacter} from '../client/ultra-characters.mjs';import {WEARABLE_CATALOG} from '../client/wearable-catalog.mjs';import {STAGES,ACTIONS} from '../client/scruffy-sprites.mjs';import {SceneCanvas} from '../client/ultra-renderer.mjs';
const painter=new ItemPainter(),cards=[],age=document.querySelector('#age'),pose=document.querySelector('#pose'),weather=document.querySelector('#weather');let moving=true;
for(const a of STAGES){const o=document.createElement('option');o.value=a.id;o.textContent=a.name;age.append(o);}age.value='adult';
for(const a of ACTIONS){const o=document.createElement('option');o.value=a.id;o.textContent=a.name||a.id;pose.append(o);}pose.value='idle';
document.querySelector('#motion').onclick=e=>{moving=!moving;e.target.textContent=moving?'Pause preview':'Resume preview';};
for(const id in FOOTWEAR_BLUEPRINTS){const card=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),canvas=document.createElement('canvas');canvas.width=720;canvas.height=460;h.textContent=WEARABLE_CATALOG[id].name;p.textContent=FOOTWEAR_BLUEPRINTS[id].material+' · '+FOOTWEAR_BLUEPRINTS[id].style.replaceAll('_',' ');card.append(h,canvas,p);document.querySelector('#cards').append(card);cards.push({id,canvas});}
function draw(card,time,stage=age.value,state=pose.value){const {id,canvas}=card,ctx=canvas.getContext('2d'),material={phase:time,wind:.5,wet:weather.value==='rain'?.9:0,snow:weather.value==='snow'?.8:0,crease:weather.value==='rumpled'?.9:0,soil:weather.value==='mud'?.8:0,slack:weather.value==='rumpled'?.6:0};ctx.fillStyle='#142e2b';ctx.fillRect(0,0,canvas.width,canvas.height);const m=itemSprite(id,time,{state:{apparel:material},motion:moving});painter.draw(ctx,m,205,350,4.3,{surface:'#142e2b',outline:'#0d211d'});const duck=characterSprite({stage,state,cosmetics:{accessory:id},apparel:{[id]:material},motion:moving},time);drawCharacter(ctx,{...duck,scale:1,x:535/7,y:365/7,sun:.75},7,7,'#142e2b');ctx.font='17px Menlo';ctx.fillStyle='#b8c9b8';ctx.textAlign='center';ctx.fillText(stage.replaceAll('_',' ')+' · '+state,535,420);}
let last=0;function tick(t){if(t-last>100){last=t;for(const card of cards){const r=card.canvas.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight)draw(card,moving?t/1000:0);}}requestAnimationFrame(tick);}requestAnimationFrame(tick);
window.reviewFootwear=(frames,careFrames=[])=>{
 const images={};for(let start=0;start<cards.length;start+=9){const sheet=document.createElement('canvas');sheet.width=2160;sheet.height=1500;const c=sheet.getContext('2d');c.fillStyle='#132b28';c.fillRect(0,0,sheet.width,sheet.height);for(const [i,card]of cards.slice(start,start+9).entries()){draw(card,.7);c.drawImage(card.canvas,i%3*720,Math.floor(i/3)*500+35);c.font='20px Menlo';c.fillStyle='#e5d5ad';c.textAlign='center';c.fillText(WEARABLE_CATALOG[card.id].name,i%3*720+360,Math.floor(i/3)*500+28);}images['cupboard-'+start/9]=sheet.toDataURL();}
 const view=new SceneCanvas();view.resize(1500,950);let count=0;
 for(const frame of frames){const before=JSON.stringify(frame);view.draw(frame.scene,0,.1);if(JSON.stringify(frame)!==before)throw Error('Renderer mutated native wardrobe');const model=view.world.characters.find(c=>c.cheese);if(frame.scene.duck.stage!=='egg'&&!model?.wearables.includes(frame.id))throw Error('Live accessory missing '+frame.id);if(model?.clipped)throw Error('Clipped live accessory '+frame.id);if(count%8===0)images['native-'+frame.id]=view.canvas.toDataURL();count++;}
 let careCount=0;
 for(const frame of careFrames){const before=JSON.stringify(frame);view.draw(frame.scene,0,.1);const m=view.world.characters.find(c=>c.cheese);if(m?.clipped)throw Error('Clipped native care');if(JSON.stringify(frame)!==before)throw Error('Care rendering changed native state');careCount++;}
 const cases=[['rain_boots','scrape_soles'],['winter_snow_boots','brush_shoe_snow'],['ice_skates','tie_skates'],['bunny_slippers','brush_slippers']];
 const poses=document.createElement('canvas');poses.width=1980;poses.height=1200;const pc=poses.getContext('2d');pc.fillStyle='#142e2b';pc.fillRect(0,0,1980,1200);
 cases.forEach(([item,action],row)=>{const samples=careFrames.filter(f=>f.id===item&&f.scene.duck.hatCare?.active?.id===action).slice(0,6);samples.forEach((f,col)=>{const m=characterSprite(f.scene.duck,0);drawCharacter(pc,{...m,scale:1,x:(col*330+165)/7,y:(row*300+260)/7,sun:.8},7,7,'#142e2b');pc.fillStyle='#e8d5ad';pc.font='18px Menlo';pc.textAlign='center';pc.fillText(action.replaceAll('_',' ')+' · '+f.scene.duck.hatCare.active.elapsed.toFixed(2)+'s',col*330+165,row*300+27);});});images['native-care-contacts']=poses.toDataURL();
 const ageSheet=document.createElement('canvas');ageSheet.width=2700;ageSheet.height=1320;const ac=ageSheet.getContext('2d');ac.fillStyle='#142e2b';ac.fillRect(0,0,2700,1320);
 ['rain_boots','winter_snow_boots','bunny_slippers','ice_skates'].forEach((id,row)=>STAGES.forEach(({id:stage},col)=>{const m=characterSprite({stage,state:'idle',cosmetics:{garment:id},apparel:{[id]:{phase:1,wind:.5}}},.7);drawCharacter(ac,{...m,scale:1,x:(col*300+150)/9,y:(row*330+270)/9,sun:.8},9,9,'#142e2b');ac.fillStyle='#e5d5ad';ac.font='16px Menlo';ac.textAlign='center';ac.fillText(stage.replaceAll('_',' '),col*300+150,row*330+25);ac.fillText(WEARABLE_CATALOG[id].name,col*300+150,row*330+310);}));images['all-ages']=ageSheet.toDataURL();
 return {images,items:cards.length,nativeFrames:count,careFrames:careCount};
};
</script>
