<!doctype html><meta charset="utf-8"><title>Shared castle renderer contract review</title>
<style>body{background:#142820;color:#eddec2;font:17px system-ui;margin:24px}canvas{max-width:100%}</style><h1>Shared castle renderer contract review</h1><p>Renderer fixtures only, not native route, lifecycle, assistance or repertoire certification. The regular guest operates; Cheese observes at an independent root.</p><main></main>
<script type="module">
import {SceneCanvas} from '../client/ultra-renderer.mjs';
import {castleArtWorld,projectCastleWorld} from '../client/castle-projection.mjs';
import {actorPitches} from '../client/actor-projection.mjs';
import GEOMETRY from '../client/animation/castle-geometry.json' with {type:'json'};
import {castleGeometry,CASTLE_SCORES,sharedCastleRecord,sharedCastleSource} from '../client/castle-care.mjs';
import {sharedCastleFixture,specialSharedCastleFixture} from './castle-shared-fixtures.mjs';
import {flightFixture} from './castle-flight-fixtures.mjs';
import METRICS from '../client/animation/castle-guest-metrics.json' with {type:'json'};
window.reviewSharedCastle=()=>{
 const view=new SceneCanvas();view.effects.level='quiet';document.querySelector('main').append(view.canvas);const images={};let checks=0;
 function draw(s,w,h){const before=JSON.stringify(s);view.resize(w,h);view.draw(s,0,0);if(JSON.stringify(s)!==before)throw Error('Mutated shared fixture');const home=view.world.objects.find(o=>o.id==='bounce_house');if(home.carnivalRiders?.length!==2)throw Error('Shared actor missing');for(const m of home.carnivalRiders){const g=castleGeometry(home,m,view.sx,view.sy);if(!g.authoritativeRoot||m.watch&&g.points.length)throw Error('Lost actual root or observer acquired contact');}checks++;return home;}
 for(const [width,height]of [[1200,800],[1800,800],[900,1100]]){draw(sharedCastleFixture('friend:marco','castle_start',0),width,height);images['contact-'+width+'x'+height]=view.canvas.toDataURL();}
 const sheet=document.createElement('canvas');sheet.width=1920;sheet.height=3600;const ctx=sheet.getContext('2d');ctx.fillStyle='#142820';ctx.fillRect(0,0,sheet.width,sheet.height);
 METRICS.adapters.regular.forEach((cast,i)=>{
  const s=sharedCastleFixture(cast,'castle_door_open',1),home=draw(s,1200,800),frame=home.physicalCastlePixels,x=i%4*480,y=Math.floor(i/4)*360;
  const left=Math.max(0,frame.left-65),top=Math.max(0,frame.top-15),width=180*frame.unit+130,height=150*frame.uh+110;
  const fit=Math.min(480/width,310/height);ctx.drawImage(view.canvas,left,top,width,height,x+(480-width*fit)/2,y+30,width*fit,height*fit);ctx.fillStyle='#eddec2';ctx.font='18px Menlo';ctx.textAlign='center';ctx.fillText(cast,x+240,y+23);
 });images['forty-profiles']=sheet.toDataURL();
 const phases=document.createElement('canvas');phases.width=1800;phases.height=900;const pc=phases.getContext('2d');pc.fillStyle='#142820';pc.fillRect(0,0,1800,900);
 for(const [row,cast]of ['friend:marco','friend:ada'].entries())for(const [col,phase]of ['approach','hold','exit'].entries()){
  draw(sharedCastleFixture(cast,'castle_hose_stow',2,{phase}),1200,800);pc.drawImage(view.canvas,col*600,row*450+30,600,400);pc.fillStyle='#eddec2';pc.font='19px Menlo';pc.textAlign='center';pc.fillText(cast+' · '+phase,col*600+300,row*450+24);
 }images.phases=phases.toDataURL();
 return {images,checks,profiles:40,scope:'renderer-fixtures-only'};
};

window.reviewSpecialSharedCastle=()=>{
 const view=new SceneCanvas();view.effects.level='quiet';const images={};let cases=0;
 for(const [cast,adapter]of [['traveling_merchant','rare'],['celebrity_duck','rare'],['lost_duckling','rare'],['lost_duckling','story']])for(const [width,height]of [[1200,800],[1800,800],[900,1100]])for(const phase of ['approach','hold','exit']){
  const s=specialSharedCastleFixture(cast,adapter,'castle_door_open',1,{phase});view.resize(width,height);view.draw(s,0,0);const home=view.world.objects.find(o=>o.id==='bounce_house');if(home?.carnivalRiders?.length!==2)throw Error('Special fixture actor missing');
  images[adapter+'-'+cast+'-'+width+'x'+height+'-'+phase]=view.canvas.toDataURL();cases++;
 }
 return {images,cases,profiles:3,bindings:4,scope:'renderer-fixtures-only'};
};

window.reviewFlightCastle=()=>{
 const view=new SceneCanvas();view.effects.level='quiet';const images={};let cases=0;
 for(const stage of ['hatchling','adult','elder'])for(const [width,height]of [[1200,800],[1800,800],[900,1100]])for(const phase of ['approach','hold','exit']){
  const s=flightFixture(stage,'castle_start',0,{phase});view.resize(width,height);view.draw(s,1.2,0);const home=view.world.objects.find(o=>o.id==='bounce_house');if(home?.carnivalRiders?.length!==2)throw Error('Flight fixture actor missing');images[stage+'-'+width+'x'+height+'-'+phase]=view.canvas.toDataURL();cases++;
 }
 // At the canonical 1:1.5 grid metric, the old clipped-grid scenery painter
 // and the new native-cell painter must produce identical canvas pixels.
 const canonical=new SceneCanvas();canonical.effects.level='quiet';canonical.resize(1200,840);const s=flightFixture('adult','castle_start',0,{motion:false});canonical.draw(s,0,0);const a=canonical.ctx.getImageData(0,0,1200,840).data.slice();
 const original=canonical.world.physicalSceneryLayer.bind(canonical.world);canonical.world.physicalSceneryLayer=(...args)=>{const layer=original(...args);delete layer.projectedCells;return layer;};canonical.draw(s,0,0);const b=canonical.ctx.getImageData(0,0,1200,840).data;let pixelDifferences=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])pixelDifferences++;if(pixelDifferences)throw Error('Canonical scenery pixels changed: '+pixelDifferences);
 images['canonical-1200x840']=canonical.canvas.toDataURL();return {images,cases,canonicalPixelDifferences:pixelDifferences,scope:'renderer-fixtures-only'};
};
const near=(a,b,label)=>{if(!Number.isFinite(a)||!Number.isFinite(b)||Math.abs(a-b)>1e-7)throw Error(label+': '+a+' != '+b);};
window.replayNativeSharedCastle=frames=>{
 if(!Array.isArray(frames)||!frames.length)throw Error('Native shared snapshots required');
 const view=new SceneCanvas();view.effects.level='quiet';const images={},bindings={},costs=[],effectSets={};let roots=0,contacts=0,watchChecks=0,cases=0;
 for(const [width,height]of [[1200,800],[1800,800],[900,1100]])for(const shifted of [false,true])for(const reduced of [false,true]){
  view.resize(width,height);const variant=width+'x'+height+'/'+shifted+'/'+reduced;
  for(const [i,source]of frames.entries()){
   const s=structuredClone(source),work=s.living?.plan?.carnival_work,shared=work?.shared,physical=work?.physical;
   if(!work?.shared_physical||!shared||!physical)throw Error('Nonshared native frame');
   if(shifted)s.camera={...s.camera,x:s.camera.x+3,y:s.camera.y+2};if(reduced)s.motion=false;
   const before=JSON.stringify(s),start=performance.now();view.draw(s,i*.2,.2);costs.push(performance.now()-start);if(JSON.stringify(s)!==before)throw Error('Mutated native shared snapshot');
   const flight=shared.mode==='flight-observer',observerPhysical=flight?shared.observer_physical:shared.cheese,guest=sharedCastleSource(s,sharedCastleRecord(work)),sourceActor=flight?s.duck:guest,watchSource=flight?guest:s.duck,cast=flight?shared.observer.cast:shared.operator.cast,adapter=flight?'flight-observer':shared.operator.adapter;if(!guest||!sourceActor)throw Error('Wrong actual visitor identity');
   near(sourceActor.x,physical.root[0],'live operator root x');near(sourceActor.y,physical.root[1],'live operator root y');near(watchSource.x,observerPhysical.root[0],'live observer root x');near(watchSource.y,observerPhysical.root[1],'live observer root y');
   const home=view.world.objects.find(o=>o.instance===s.living.plan.instance),members=home?.carnivalRiders;
   if(members?.length!==2)throw Error('Native shared actor missing '+s._physicalCase);
   const operator=members.find(m=>m.role==='a'),watcher=members.find(m=>m.watch);if(flight?operator.actor!=='cheese'||!operator.character.cheese||watcher.character.profileId!==cast||watcher.character.rig.feet.length:operator.character.id!==sourceActor.id||operator.character.profileId!==cast||watcher.actor!=='cheese')throw Error('Native role/profile replaced');
   const cg=castleGeometry(home,operator,view.sx,view.sy),wg=castleGeometry(home,watcher,view.sx,view.sy);
   for(const [member,g,root]of [[operator,cg,physical.root],[watcher,wg,observerPhysical.root]]){
    if(!g.authoritativeRoot)throw Error('Renderer owns a shared root');const p=projectCastleWorld(home.physicalCastle,root,view.sx,view.sy),pitch=actorPitches(member.character,view.sx,view.sy);near(g.character.x*view.sx,p.x,'displayed root x');near(g.character.y*view.sy,p.y,'displayed root y');near(pitch.ch/pitch.cw,1.5,'body cell aspect');roots++;
   }
   if(wg.points.length||wg.pose.contact||wg.pose.surfaceWork||watcher.character.grip)throw Error('Observer acquired operator contact');watchChecks++;
   const anchor=GEOMETRY.controls[physical.station],nativeTarget=castleArtWorld(home.physicalCastle.origin,anchor.x,anchor.y,{center:true}),target=projectCastleWorld(home.physicalCastle,nativeTarget,view.sx,view.sy);
   near(physical.target[0],nativeTarget[0],'control native x');near(physical.target[1],nativeTarget[1],'control native y');near(cg.target.x,target.x,'control pixel x');near(cg.target.y,target.y,'control pixel y');
   if((physical.phase!=='hold'||!physical.contact_ready||observerPhysical.phase!=='hold'||!observerPhysical.ready||shared.phase!=='operate')&&cg.points.length)throw Error('Premature operator contact');
   if((flight?operator:watcher).character.rig.stage!==shared.source_age)throw Error('Observer age rig replaced');
   const key=adapter+'/'+cast+'/'+work.id+'/'+shared.source_age,b=bindings[key]??={cast,adapter,score:work.id,age:shared.source_age,cases:0,effects:new Set(),phases:new Set(),watchPhases:new Set()};b.cases++;b.phases.add(physical.phase);b.watchPhases.add(observerPhysical.phase);
   if(s._physicalEvent!==undefined){const index=s._physicalEvent,effect=CASTLE_SCORES[work.id].effects[index];if(!effect||!work.events.includes(index))throw Error('Invalid consumed effect');near(work.ride_elapsed,effect[0]*CASTLE_SCORES[work.id].duration,'effect clock');if(!cg.tip||cg.pose.contact<1-1e-8||!cg.reachable)throw Error('Native effect has no rendered actual grip '+key+'/'+index);near(cg.tip.x,target.x,'effect contact x');near(cg.tip.y,target.y,'effect contact y');b.effects.add(index);(effectSets[variant+'/'+key]??=new Set()).add(index);contacts++;}
   if(!shifted&&!reduced&&(adapter!=='regular'||['friend:marco','friend:ada','friend:frida'].includes(cast))&&(s._physicalEvent===undefined||s._physicalEvent===0)){
    const imageKey=adapter+'-'+cast.replace('friend:','')+'-'+work.id+'-'+shared.source_age+'-'+width+'x'+height+'-'+physical.phase+(s._physicalEvent!==undefined?'-contact':'');if(!images[imageKey])images[imageKey]=view.canvas.toDataURL();
   }
   cases++;
  }
  for(const [key,b]of Object.entries(bindings))if(effectSets[variant+'/'+key]?.size!==CASTLE_SCORES[b.score].effects.length)throw Error('Missing native effects for '+variant+'/'+key);
 }
 const scores=Object.fromEntries(Object.entries(bindings).map(([key,b])=>[key,{...b,effects:[...b.effects],phases:[...b.phases],watchPhases:[...b.watchPhases]}]));
 for(const b of Object.values(scores))if(!b.phases.includes('approach')||!b.phases.includes('exit')||!b.watchPhases.includes('approach')||!b.watchPhases.includes('exit'))throw Error('Native shared phase coverage incomplete');
 costs.sort((a,b)=>a-b);return {images,scores,sourceFrames:frames.length,cases,roots,contacts,watchChecks,profiles:new Set(Object.values(scores).map(b=>b.cast)).size,ages:[...new Set(Object.values(scores).map(b=>b.age))],windowSizes:3,cameras:2,motionModes:2,medianMs:costs[Math.floor(costs.length*.5)],p95Ms:costs[Math.floor(costs.length*.95)],scope:'native-snapshots-render-only'};
};
</script>
