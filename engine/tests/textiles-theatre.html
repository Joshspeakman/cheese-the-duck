<!doctype html><meta charset="utf-8"><title>Cheese · Textile workshop</title>
<style>body{background:#142b23;color:#ecdbb3;font:20px Georgia;margin:24px}canvas{display:block;max-width:100%;margin:24px 0}</style>
<h1>Textiles · current in-game construction</h1>
<script type="module">
import {TEXTILE_BLUEPRINTS} from '../client/textile-workshop.mjs';
import {itemSprite,ItemPainter} from '../client/ultra-items.mjs';
import {SceneCanvas} from '../client/ultra-renderer.mjs';
import {characterSprite,drawCharacter} from '../client/ultra-characters.mjs';
import {textileGeometry,drawTextileTools,textilePose,TEXTILE_ROUTINES,TEXTILE_CONTROLS,TEXTILE_COMPANY} from '../client/textile-routines.mjs';
import {GUEST_CAST} from '../client/guest-cast.mjs';
const painter=new ItemPainter(),surface='#142b23';
function sheet(w,h){const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle=surface;ctx.fillRect(0,0,w,h);return [canvas,ctx];}
window.reviewTextiles=()=>{
 const images={},ids=Object.keys(TEXTILE_BLUEPRINTS);
 for(let page=0;page<Math.ceil(ids.length/4);page++){
  const [canvas,c]=sheet(1800,1400);
  ids.slice(page*4,page*4+4).forEach((id,n)=>{
   const m=itemSprite(id,0,{state:{textile:{...TEXTILE_CONTROLS,tracks:[]}}}),x=n%2*900,y=Math.floor(n/2)*700;
   c.fillStyle='#e5d8b4';c.font='23px Menlo';c.fillText(id,x+20,y+35);
   const unit=Math.min(5,840/m.width,610/(m.art.length*1.5));painter.draw(c,m,x+450,y+670,unit/m.detailScale,{surface,outline:'#0a1712'});
  });images['textile-objects-'+page]=canvas.toDataURL();document.body.append(canvas);
 }
 for(const [item,id,at] of [['persian_rug','fringe_comb',.6],['tatami_mat','tatami_grain',.6],['welcome_mat','welcome_wipe',.6],['moss_carpet','moss_pat',.6],['thatch','reed_sort',.6],['carpet_red','mat_roll',.65]]){
  const [canvas,ctx]=sheet(1800,850);
  ['hatchling','adult','elder'].forEach((stage,i)=>{
   const routine={id,elapsed:TEXTILE_ROUTINES[id].duration*at,start:TEXTILE_CONTROLS},pose=textilePose(routine);
   const home={...itemSprite(item,0,{state:{textile:{...TEXTILE_CONTROLS}},pose:{textile:pose}}),x:50+i*100,y:96,scale:TEXTILE_BLUEPRINTS[item].scale};
   const character={...characterSprite({stage,state:'idle',facing:true,performance:{kind:'textile',routine}},0),x:home.x,y:home.y};
   painter.draw(ctx,home,home.x*6,home.y*8,6*home.scale,{surface});
   const g=textileGeometry(home,{character,inside:1},6,8);drawCharacter(ctx,g.character,6,8,surface);drawTextileTools(ctx,g);
   ctx.fillStyle='#e5d8b4';ctx.font='23px Menlo';ctx.fillText(item+' · '+stage,i*600+20,35);
  });images['textile-ages-'+item]=canvas.toDataURL();document.body.append(canvas);
 }
 return images;
};
window.reviewTextileCompany=()=>{
 const images={},entries=Object.entries(TEXTILE_COMPANY),casts=['friend:frida','friendly_goose','friend:ada','lost_duckling','butterfly_fairy'];
 const items={mat_unroll:'carpet_red',fringe_comb:'persian_rug',lint_brush:'rug',corner_smooth:'tatami_mat',medallion_trace:'persian_rug',young_steps:'carpet_red',night_listen:'woven_grass',moss_pat:'moss_carpet',grass_dew:'grass_patch',grass_tracks:'grass_floor',rubber_drain:'rubber_mat',welcome_wipe:'welcome_mat',reed_sort:'thatch',batting_fluff:'insulation',scrap_fold:'fabric_scrap',weave_tighten:'woven_grass'};
 for(let page=0;page<Math.ceil(entries.length/4);page++){
  const [canvas,ctx]=sheet(1800,1200);
  entries.slice(page*4,page*4+4).forEach(([id,shared],i)=>{
   const core=shared.preview,item=items[core],work={id:core,elapsed:TEXTILE_ROUTINES[core].duration*.6,start:{...TEXTILE_CONTROLS,roll:core==='mat_unroll'?1:0}};
   const x=i%2*900,y=Math.floor(i/2)*600,home={...itemSprite(item,0,{pose:{textile:textilePose(work)}}),x:(x+380)/6,y:(y+520)/8,scale:TEXTILE_BLUEPRINTS[item].scale};
   painter.draw(ctx,home,home.x*6,home.y*8,6*home.scale,{surface});
   const profile=Object.values(GUEST_CAST).find(g=>g.id===(id==='hover_observer'?'butterfly_fairy':casts[(page*4+i)%casts.length]))||Object.values(GUEST_CAST)[0];
   for(const slot of [0,1]){
    const routine={...work,company:{id,role:slot?'b':'a'}},source=slot?{id:profile.id,castId:profile.id,name:profile.name}:{stage:page===0?'hatchling':page===2?'elder':'adult'};
    const character={...characterSprite({...source,state:'idle',facing:!slot,performance:{kind:'textile',routine}},0,Boolean(slot)),x:home.x,y:home.y};
    const g=textileGeometry(home,{character,inside:1,slot},6,8);drawCharacter(ctx,g.character,6,8,surface);drawTextileTools(ctx,g);
   }
   ctx.fillStyle='#e5d8b4';ctx.font='20px Menlo';ctx.fillText(id+' / '+profile.name,x+20,y+35);
  });images['textile-company-'+page]=canvas.toDataURL();document.body.append(canvas);
 }
 return images;
};
window.replayTextiles=frames=>{
 const view=new SceneCanvas();view.resize(1500,950);const images={},costs=[];let drawn=0,workers=0,companions=0;
 for(const [i,s]of frames.entries()){
  const before=JSON.stringify(s),start=performance.now();view.draw(s,i*.2,.2);costs.push(performance.now()-start);
  if(JSON.stringify(s)!==before)throw Error('Textile renderer changed native state');
  for(const o of view.world.objects)if(o.construction==='textile-v1'){
   drawn++;if(o.clipped)throw Error('Clipped textile '+o.id);workers+=o.textileUsers?.length||0;
   for(const r of o.textileUsers||[]){
    if(r.character.clipped)throw Error('Clipped textile user');
    if(r.slot===1){
     companions++;const hit=view.hits.find(h=>h.id===r.character.id&&['friend','story'].includes(h.kind));
     if(!hit||view.hit((hit.x+hit.w/2)/view.canvas.width,(hit.y+hit.h/2)/view.canvas.height)?.id!==r.character.id)throw Error('Textile visitor is not selectable where drawn');
     const name='textile-company-live-'+o.id;
     if(!images[name]&&r.character.performance.routine.elapsed>12)images[name]=view.canvas.toDataURL();
    }
   }
  }
  if(s.review)images['textile-live-'+s.review]=view.canvas.toDataURL();
 }
 costs.sort((a,b)=>a-b);return {frames:frames.length,drawn,workers,companions,medianMs:costs[Math.floor(costs.length*.5)],p95Ms:costs[Math.floor(costs.length*.95)],images};
};
</script>
