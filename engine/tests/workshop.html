<!doctype html><meta charset="utf-8"><title>Pond workshop — milestone review</title><style>body{margin:0;background:#132821;color:#e5d5af;font:15px Georgia}header{padding:28px 36px}h1{margin:0 0 8px}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 24px 28px}article{background:#1d332b;border:1px solid #817b5544;border-radius:8px;padding:12px}h2{font-size:18px;margin:0}p{font:12px monospace;color:#adbba3}canvas{width:100%;height:330px;display:block}</style><header><h1>Homes, nests & playground things</h1><p>New character-built constructions. Work in progress: animation breadth and live choreography are separate verification gates.</p></header><div id="grid"></div><script type="module">
import {HOME_BLUEPRINTS} from '../client/home-workshop.mjs';import {PLAY_BLUEPRINTS} from '../client/playground-workshop.mjs';import {itemSprite,ItemPainter} from '../client/ultra-items.mjs';import {ITEM_CATALOG} from '../client/item-catalog.mjs';
const painter=new ItemPainter(),cards=[];for(const id of Object.keys({...HOME_BLUEPRINTS,...PLAY_BLUEPRINTS})){const n=document.createElement('article');n.innerHTML='<h2></h2><p></p><canvas width="600" height="440"></canvas>';n.querySelector('h2').textContent=ITEM_CATALOG[id].name;n.querySelector('p').textContent=id;document.querySelector('#grid').append(n);cards.push({id,canvas:n.querySelector('canvas')});}
window.paint=(time=1,context={season:'fall',hour:20,weather:'rain'})=>{for(const {id,canvas}of cards){const m=itemSprite(id,time,{context,interaction:{phase:'act'},pose:{door:.75,blanket:.3,pillow:.5}}),c=canvas.getContext('2d');c.fillStyle='#1d332b';c.fillRect(0,0,600,440);const unit=Math.min(5.5,570/(m.width*.72),415/(m.art.length*1.5*.72));painter.draw(c,m,300,425,unit,{shadow:true,surface:'#182b24',outline:'#0d1a17'});}return true;};window.paint();window.ready=true;
</script>
